# 虚拟教研社区 — Supervisor 守护进程配置
# 放到 /etc/supervisor/conf.d/teaching-research.conf
# 然后执行: supervisorctl reread && supervisorctl update

[program:teaching-research-backend]
directory=/var/www/teaching-research/backend
command=/var/www/teaching-research/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
autostart=true
autorestart=true
stderr_logfile=/var/log/teaching-research/error.log
stdout_logfile=/var/log/teaching-research/access.log
user=www-data
environment=PATH="/var/www/teaching-research/venv/bin"
